<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1628">
    <title>Sin conexión — Marketplace Manager</title>
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #101d34;
            color: #e2e8f0;
            font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        main { max-width: 360px; display: grid; gap: 16px; justify-items: center; }
        img { width: 72px; height: 72px; border-radius: 18px; }
        h1 { margin: 0; font-size: 20px; color: #fff; }
        p { margin: 0; color: #8097b8; font-size: 14px; line-height: 1.6; }
        button {
            margin-top: 8px;
            border: 0;
            border-radius: 10px;
            padding: 12px 22px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #7c3aed, #00d4ff);
            cursor: pointer;
        }
        button:focus-visible { outline: 2px solid #00d4ff; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="icons/icon-192.png" alt="">
        <h1>Sin conexión</h1>
        <p>No hay internet en este momento. El panel necesita conexión para mostrar tus ventas, productos y preguntas actualizados.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
